<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penguin Shopping</title>
    <link rel="stylesheet" href="style.css">
    <!-- Tailwind css cdn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Fontawesome cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <section class="bg-[#FFFBF0] pb-16">
        <header class="container mx-auto">
            <!-- Navbar -->
            <nav class="flex justify-between items-center py-4">
                <div>
                    <img src="./assets/icons/logo.png" alt="" class="h-10">
                </div>
                <ul class="hidden md:flex gap-3 font-semibold cursor-pointer">
                    <li>Home</li>
                    <li>Product</li>
                    <li>About Us</li>
                    <li>Contact Us</li>
                </ul>
                <i class="fa-solid fa-bars block md:hidden!"></i>
            </nav>
            <!-- Banner -->
            <section class="flex flex-col-reverse md:flex-row justify-between items-center">
                <div class="space-y-3">
                    <h1 class="text-5xl lg:text-7xl text-[#363958] font-bold flex flex-col"><span
                            class="text-[#FABE4C]">Be the
                            Penguins</span>
                        of Winter</h1>
                    <p class="text-[#3E3E3E]">Lorem Ipsum is simply dummy text of the printing
                        and typesetting industry.</p>
                    <div>
                        <button
                            class="px-4 py-3 text-sm text-white rounded-xl bg-linear-to-r from-[#A4BC46] to-[#85A019] cursor-pointer"><i
                                class="fa-solid fa-cart-shopping"></i> BUY
                            NOW</button>
                    </div>
                </div>
                <div>
                    <img src="./assets/images/model.png" alt="">
                </div>
            </section>
        </header>
    </section>
</body>

</html>
